# Embark CI（issues/10）
#
# 四个 job：
#   1. host-build-test：ubuntu 上构建宿主工程 + ctest 全量单测（SDL2 用 apt 装）。
#   2. esp32-build：espressif/idf:release-v5.4 容器里构建 ESP32-S3 固件（只编不烧）。
#      issue 11 已落地，所以是真构建：同一个仓库、同一套源码，宿主与真机两个目标都必须过。
#   3. font-audit：缺字审计（issue 17 / ADR 0017）——界面文案逐字符对照卡上那份 TTF 的 cmap
#      （app/aidogui_ui/assets/font/ui_heiti.ttf，脚本自己解 cmap），字体里没有的字符就把构建卡红；
#      先跑 --selftest 保证脚本本身没退化。
#   4. format-check：clang-format --dry-run --Werror（版本 18，与本地开发机一致；
#      .clang-format 里的注释说明：v1 阶段不强制本机格式化，CI 只作提示/卡漂移）。
#
# 排除不参与格式检查的文件（与本地 dry-run 口径一致）：
#   - third_party/**           第三方源码不动
#   - .scratch/embark-v1/spikes/**  实验存档不格式化
#   - core/config/lv_conf.h         LVGL 官方配置模板
#   - host/freertos/FreeRTOSConfig.h  FreeRTOS 官方配置模板
#   - app/aidogui_ui/**         AiDoGUI Designer 生成代码（ADR 0011），重导出即覆盖
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-build-test:
    name: Host build & tests
    runs-on: ubuntu-latest
    steps:
      - name: Restore submodule cache
        uses: actions/cache@v4
        with:
          path: third_party
          key: submodules-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            submodules-
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: build
          key: host-build-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/*.h', '**/*.cpp') }}
          restore-keys: |
            host-build-
      - name: Configure
        run: cmake -G Ninja -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  esp32-build:
    name: ESP32-S3 firmware build (issue 11)
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.4
    steps:
      - name: Restore submodule cache
        uses: actions/cache@v4
        with:
          path: third_party
          key: submodules-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            submodules-
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        # 构建目录放仓库根的 build-esp32/（.gitignore 的 build-*/ 已覆盖）；
        # sdkconfig 由 idf.py 生成在 device/project/ 下，同样不进仓库。
        run: |
          idf.py --version
          idf.py -C device/project -B build-esp32 set-target esp32s3
          idf.py -C device/project -B build-esp32 build

  font-audit:
    name: Font glyph audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit script self-test
        run: node tools/font/audit_glyphs.mjs --selftest
      - name: Audit UI strings against font cmap
        run: node tools/font/audit_glyphs.mjs

  format-check:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Dry-run
        run: |
          FILES=$(git ls-files '*.cpp' '*.h' '*.hpp' '*.cc' | grep -v -E '^(third_party/|\.scratch/embark-v1/spikes/|core/config/lv_conf\.h$|host/freertos/FreeRTOSConfig\.h$|app/aidogui_ui/)')
          clang-format --dry-run --Werror $FILES